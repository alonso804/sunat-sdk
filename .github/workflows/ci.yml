name: CI

# Verifica el proyecto en una máquina limpia en cada push (cualquier rama) y también a mano desde la pestaña Actions.
# No contacta a SUNAT: las pruebas contra beta se saltan sin SUNAT_BETA=1.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

# Si llega otro push a la misma rama, se cancela la ejecución anterior (ahorra minutos).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Biome, typecheck, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.28.10

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
